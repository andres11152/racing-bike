name: racing-bike

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: ${DB_NAME:-racingbike}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.4-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-racingbike}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        ini_set('memory_limit', '512M');
        define('GA4_MEASUREMENT_ID', '${GA4_MEASUREMENT_ID:-}');
        define('META_PIXEL_ID', '${META_PIXEL_ID:-}');
        define('SMTP_HOST', '${SMTP_HOST:-}');
        define('SMTP_PORT', '${SMTP_PORT:-}');
        define('SMTP_USER', '${SMTP_USER:-}');
        define('SMTP_PASS', '${SMTP_PASS:-}');
        define('SMTP_SECURE', '${SMTP_SECURE:-}');
        define('SMTP_FROM_EMAIL', '${SMTP_FROM_EMAIL:-}');
        define('SMTP_FROM_NAME', '${SMTP_FROM_NAME:-}');
    volumes:
      - wp_data:/var/www/html
      # El theme vive en el host: editar Blade/CSS se refleja sin reconstruir la imagen.
      - ./racing-bike-theme:/var/www/html/wp-content/themes/racing-bike-theme
      - ./racing-bike-size-calculator:/var/www/html/wp-content/plugins/racing-bike-size-calculator
      - ./racing-bike-bike-builder:/var/www/html/wp-content/plugins/racing-bike-bike-builder
      - ./racing-bike-reviews:/var/www/html/wp-content/plugins/racing-bike-reviews
      - ./racing-bike-cro-booster:/var/www/html/wp-content/plugins/racing-bike-cro-booster
      - ./skycode-anti-spam:/var/www/html/wp-content/plugins/skycode-anti-spam
      - ./skycode-analytics:/var/www/html/wp-content/plugins/skycode-analytics
      - ./skycode-smtp:/var/www/html/wp-content/plugins/skycode-smtp
      - ./skycode-cart-recovery:/var/www/html/wp-content/plugins/skycode-cart-recovery
      - ./skycode-maintenance:/var/www/html/wp-content/plugins/skycode-maintenance
      - ./skycode-modal:/var/www/html/wp-content/plugins/skycode-modal
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini


  # Servicio de utilidad: no corre en segundo plano, se invoca con `docker compose run --rm wpcli <args>`
  wpcli:
    image: wordpress:cli-php8.4
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-racingbike}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./racing-bike-theme:/var/www/html/wp-content/themes/racing-bike-theme
      - ./racing-bike-size-calculator:/var/www/html/wp-content/plugins/racing-bike-size-calculator
      - ./racing-bike-bike-builder:/var/www/html/wp-content/plugins/racing-bike-bike-builder
      - ./racing-bike-reviews:/var/www/html/wp-content/plugins/racing-bike-reviews
      - ./racing-bike-cro-booster:/var/www/html/wp-content/plugins/racing-bike-cro-booster
      - ./skycode-anti-spam:/var/www/html/wp-content/plugins/skycode-anti-spam
      - ./skycode-analytics:/var/www/html/wp-content/plugins/skycode-analytics
      - ./skycode-smtp:/var/www/html/wp-content/plugins/skycode-smtp
      - ./skycode-cart-recovery:/var/www/html/wp-content/plugins/skycode-cart-recovery
      - ./skycode-maintenance:/var/www/html/wp-content/plugins/skycode-maintenance
      - ./skycode-modal:/var/www/html/wp-content/plugins/skycode-modal
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

volumes:
  db_data:
  wp_data:
